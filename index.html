<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventory Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<style>

  /* ============================================================
     TOKENS
  ============================================================ */
  :root{
    --void:      #07070c;
    --panel:     #101018;
    --panel-2:   #16161f;
    --line:      #24242f;
    --text:      #eceaf4;
    --muted:     #82829a;
    --holo-pink:   #ff6ec7;
    --holo-gold:   #ffd166;
    --holo-cyan:   #5eead4;
    --holo-purple: #a78bfa;
  }

  *{ box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    background: var(--void);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* faint diamond/hex-ish backdrop texture, like a card-binder page */
  body::before{
    content:"";
    position: fixed; inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.02) 0 1px, transparent 1px 26px);
    pointer-events:none;
    z-index:0;
  }

  /* holo strip along the very top, like foil edging on a booster box */
  .foil-strip{
    height: 6px;
    width:100%;
    background: linear-gradient(90deg,
      var(--holo-gold), var(--holo-pink), var(--holo-purple), var(--holo-cyan), var(--holo-gold));
    background-size: 300% 100%;
    animation: driftFoil 12s linear infinite;
  }
  @keyframes driftFoil{
    0%{ background-position: 0% 0; }
    100%{ background-position: 300% 0; }
  }

  /* ============================================================
     HEADER
  ============================================================ */
  header{
    position:relative; z-index:1;
    padding: 28px clamp(20px, 4vw, 56px) 18px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid var(--line);
  }
  .titleblock .eyebrow{
    font-family:'Rajdhani', sans-serif;
    letter-spacing: .35em;
    font-size: 11px;
    font-weight: 700;
    color: var(--holo-cyan);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  .titleblock h1{
    font-family:'Orbitron', sans-serif;
    font-weight: 800;
    font-size: clamp(22px, 3.4vw, 34px);
    margin:0;
    letter-spacing: .02em;
    background: linear-gradient(90deg, #fff, var(--holo-cyan) 60%, var(--holo-pink));
    -webkit-background-clip:text;
    background-clip:text;
    color: transparent;
  }
  .counter{
    font-family:'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: .12em;
    color: var(--muted);
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 14px;
    border-radius: 999px;
  }
  .counter b{ color: var(--text); }

  /* ============================================================
     AUTO-SCROLL TOGGLE — small, fixed top-right, stream-safe
  ============================================================ */
  .auto-scroll-btn{
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 70;
    display:flex;
    align-items:center;
    gap: 6px;
    font-family:'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(16,16,24,.85);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, box-shadow .2s ease;
  }
  .auto-scroll-btn:hover{ color: var(--text); border-color: #3a3a4a; }
  .auto-scroll-btn .dot{
    width: 7px; height: 7px;
    border-radius: 999px;
    background: var(--muted);
    flex-shrink:0;
  }
  .auto-scroll-btn.active{
    color: #fff;
    border-color: transparent;
    background: linear-gradient(90deg, var(--holo-pink), var(--holo-purple));
    box-shadow: 0 0 16px rgba(255,110,199,.45);
  }
  .auto-scroll-btn.active .dot{
    background: #fff;
    animation: pulseDot 1s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%, 100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(.7); }
  }
  @media (prefers-reduced-motion: reduce){
    .auto-scroll-btn.active .dot{ animation: none; }
  }

  /* ============================================================
     MODE TOGGLE — MAIN / HOLO
  ============================================================ */
  .mode-row{
    position: relative; z-index:1;
    display:flex;
    gap: 12px;
    justify-content:center;
    flex-wrap: wrap;
    padding: 22px clamp(16px, 4vw, 56px) 4px;
  }
  .mode-btn{
    font-family:'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .1em;
    padding: 11px 26px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    transition: transform .1s ease, border-color .15s ease, color .15s ease, box-shadow .2s ease, background .2s ease;
  }
  .mode-btn:hover{ color: var(--text); border-color: #3a3a4a; }
  .mode-btn:active{ transform: scale(.97); }

  .mode-btn.active[data-mode="main"]{
    background: #fff;
    color: #0b0b12;
    border-color: #fff;
  }
  .mode-btn.active[data-mode="holo"]{
    background: linear-gradient(90deg, var(--holo-pink), var(--holo-purple));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 0 22px rgba(255,110,199,.45);
  }

  /* ============================================================
     SEARCH / FILTER
  ============================================================ */
  .search-row{
    position: relative; z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    padding: 14px clamp(16px, 4vw, 56px) 4px;
    flex-wrap: wrap;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap: 8px;
    width: min(340px, 100%);
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    transition: border-color .15s ease;
  }
  .search-box:focus-within{ border-color: var(--holo-cyan); }
  .search-box svg{ flex-shrink:0; opacity:.6; }
  .search-box input{
    flex:1;
    min-width:0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .search-box input::placeholder{ color: var(--muted); }
  .search-count{
    font-family:'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--muted);
    white-space: nowrap;
    min-height: 1em;
  }

  /* a slot filtered out by search simply leaves the grid flow */
  .slot.search-hidden{ display:none; }

  /* ============================================================
     GALLERY GRID
  ============================================================ */
  main{
    position: relative; z-index:1;
    padding: 28px clamp(16px, 4vw, 56px) 80px;
  }
  .gallery{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: clamp(12px, 1.6vw, 22px);
  }

  /* every slot: fixed 9:16 ratio, whatever the column width ends up being */
  .slot{
    aspect-ratio: 9 / 16;
    perspective: 900px;
    position: relative;
  }

  .card{
    position:absolute; inset:0;
    border-radius: 14px;
    overflow:hidden;
    cursor: pointer;
    background: var(--panel-2);
    border: 1px solid var(--line);
    box-shadow: 0 10px 24px rgba(0,0,0,.5);
  }

  /* grid preview cards: no tilt, no pointer tracking — just a quiet
     lift on hover so scrolling the gallery feels calm, not shiny */
  .gallery .card{
    transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .gallery .card:hover,
  .gallery .card:focus-visible{
    transform: translateY(-4px);
    box-shadow: 0 18px 34px rgba(0,0,0,.6);
    border-color: var(--holo-cyan);
  }

  /* the enlarged/modal card gets the real pointer-driven tilt */
  .modal .card{
    --mx:50%; --my:50%; --posx:50%; --posy:50%; --hyp:0; --rx:0deg; --ry:0deg;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transform-style: preserve-3d;
    transition: transform .12s ease-out;
  }
  .modal .card.is-resting{ transition: transform .6s cubic-bezier(.2,.8,.2,1); }

  .card img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    pointer-events:none;
  }

  /* placeholder shown if an image path is missing / not found yet */
  .card .placeholder{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:6px;
    background: repeating-linear-gradient(135deg, #1a1a24 0 10px, #15151d 10px 20px);
    color: var(--muted);
    font-family:'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: .1em;
    text-align:center;
    padding: 10px;
  }

  .tag{
    position:absolute; left:8px; bottom:8px;
    z-index:5;
    font-family:'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: .06em;
    color: #fff;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.15);
    padding: 3px 7px;
    border-radius: 6px;
    pointer-events:none;
  }

  /* ---- lighting layers, modal-only now ----
     .holo-glare = the plain "light catching a glossy print" highlight,
     used for BOTH modes (MAIN and HOLO both get tilt + this glare).
     .holo-shine = the rainbow foil sweep, only ever shown when the
     card carries the .holo class (i.e. HOLO mode is selected). */
  .holo-shine, .holo-glare{
    position:absolute; inset:0;
    pointer-events:none;
  }
  .holo-glare{
    background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.9), rgba(255,255,255,0) 55%);
    mix-blend-mode: soft-light;
    opacity: calc(var(--hyp) * 0.85 + 0.1);
  }
  .holo-shine{
    background: repeating-linear-gradient(
      115deg,
      var(--holo-pink) 0%, var(--holo-gold) 12%, var(--holo-cyan) 24%,
      var(--holo-purple) 36%, var(--holo-pink) 48%
    );
    background-size: 300% 300%;
    background-position: var(--posx) var(--posy);
    mix-blend-mode: color-dodge;
    opacity: 0;
    transition: opacity .15s ease;
  }
  .card.holo .holo-shine{
    opacity: calc(var(--hyp) * 0.8 + 0.04);
  }

  /* rim light border, modal only, shows while actively tilting */
  .modal .card::after{
    content:"";
    position:absolute; inset:0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(255,255,255, calc(var(--hyp) * .5));
    pointer-events:none;
  }

  /* ============================================================
     MODAL / CLOSEUP
  ============================================================ */
  .modal{
    position: fixed; inset:0;
    z-index: 50;
    display:none;
    align-items:center;
    justify-content:center;
    background: rgba(4,4,8,.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 24px;
  }
  .modal.open{ display:flex; }

  .modal-stage{
    position:relative;
    perspective: 1400px;
    height: min(84vh, 920px);
    aspect-ratio: 9 / 16;
    max-width: 92vw;
  }

  .modal .card{
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04);
    cursor: default;
  }

  /* scroll-wheel zoom + middle-click drag pan, both live on the image
     itself so they compose cleanly with the card's own tilt transform
     instead of fighting it. translate() is listed before scale() so the
     pan amount is in plain screen pixels, unaffected by zoom level. */
  #modalImg{
    --zoom: 1;
    --panX: 0px;
    --panY: 0px;
    transform: translate(var(--panX), var(--panY)) scale(var(--zoom));
    transition: transform .15s ease-out;
    will-change: transform;
  }
  /* while actively dragging, transform must track the cursor with zero
     lag — the transition only comes back once the mouse is released */
  #modalImg.dragging{
    transition: none;
    cursor: grabbing;
  }
  #modalImg.zoomed{
    cursor: grab;
  }

  .modal-controls{
    position:absolute; top:-52px; right:0;
    display:flex; gap:10px;
  }
  .modal-tag{
    position:absolute; top:-52px; left:0;
    font-family:'Orbitron', sans-serif;
    font-size: 13px; letter-spacing:.1em;
    color: var(--muted);
  }
  .modal-tag b{ color: var(--text); }

  .icon-btn{
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-family:'Orbitron', sans-serif;
    font-size: 16px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .icon-btn:hover{ border-color: var(--holo-cyan); color: var(--holo-cyan); }
  .icon-btn:active{ transform: scale(.94); }

  .nav-arrow{
    position:absolute; top:50%; translate: 0 -50%;
    width: 46px; height: 46px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(16,16,24,.8);
    color: var(--text);
    font-size: 20px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .15s ease, color .15s ease;
  }
  .nav-arrow:hover{ border-color: var(--holo-pink); color: var(--holo-pink); }
  .nav-prev{ left: -64px; }
  .nav-next{ right: -64px; }

  @media (max-width: 760px){
    .nav-prev{ left: -8px; }
    .nav-next{ right: -8px; }
    .nav-arrow{ width:38px; height:38px; }
  }

  /* keyboard-focus visibility (a11y) */
  .card:focus-visible, .icon-btn:focus-visible, .nav-arrow:focus-visible{
    outline: 2px solid var(--holo-cyan);
    outline-offset: 2px;
  }

  /* reduced motion respect */
  @media (prefers-reduced-motion: reduce){
    .foil-strip{ animation: none; }
    .card{ transition: none; }
  }
</style>
</head>
<body>

  <div class="foil-strip"></div>

  <header>
    <div class="titleblock">
      <p class="eyebrow">Local Inventory Database</p>
      <h1>Product Gallery</h1>
    </div>
    <div class="counter">SHOWING <b id="countLabel">000</b> ITEMS</div>
  </header>

  <button class="auto-scroll-btn" id="autoScrollBtn" aria-pressed="false">
    <span class="dot"></span>
    <span id="autoScrollLabel">AUTO</span>
  </button>

  <div class="mode-row">
    <button class="mode-btn active" data-mode="main">MAIN</button>
    <button class="mode-btn" data-mode="holo">HOLO</button>
  </div>

  <div class="search-row">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search inventory..." autocomplete="off" />
    </div>
    <span class="search-count" id="searchCount"></span>
  </div>

  <main>
    <div class="gallery" id="gallery"></div>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-stage" id="modalStage">
      <span class="modal-tag" id="modalTag"></span>
      <div class="modal-controls">
        <button class="icon-btn" id="closeBtn" aria-label="Close">✕</button>
      </div>
      <div class="card" id="modalCard" tabindex="0">
        <img id="modalImg" src="" alt="" />
        <div class="holo-glare"></div>
        <div class="holo-shine"></div>
      </div>
      <button class="nav-arrow nav-prev" id="prevBtn" aria-label="Previous">‹</button>
      <button class="nav-arrow nav-next" id="nextBtn" aria-label="Next">›</button>
    </div>
  </div>

<script>
  /* ============================================================
     PRODUCTS — this is the only part you ever need to touch.
     Add a new product by pasting ONE new line above the closing
     bracket. Local file paths, subfolders, or full URLs all work.
     Handles up to 100+ rows fine — the grid, numbering, and modal
     nav all rebuild themselves automatically from this array.
  ============================================================ */
  const PRODUCTS = [
    "images/_newLOGO miniArtorama.png",
    "images/Gozer the Traveler.png",
    "images/The Real Vampirella.png",
	"images/Cyberpunk Assassin.png",
	"images/BikerCyberpunk.png",
    "images/Mandolorian Scubadiver.png",
    "images/Labyrinth of Labors.png",
    "images/Rick and Morty.png",
    "images/Mega Raichu Ex.png",
    "images/51-pokemonA.png",
	"images/Lightbox Pokemon B.png",
	"images/MARIObros StarNFT_CopyrightHando2022.png",
    "images/Goth Angel Shackled.png",
    "images/gothFetLifeLibrary.png",
	"images/Don_macMiller.png",	
	"images/charmanderKC.png",
	"images/pikiachuTinyArt.png",
	"images/Gengar.png",
	"images/mewKC.png",
	"images/BabyMew.png",
	"images/MewTwo2.png",
	"images/Mimikyu3.png",
	"images/MimikyuPikaZipper.png",
	"images/mimikyu.png",
	"images/Batman Who Laughs.png",
	"images/Skeletor1.png",
	"images/Spiderman2.png",
	"images/edward_scissorhands.png",
	"images/AkiraExplosion.png",
	"images/Godzilla.png",
	"images/deadpool_aceo.png",
	"images/wolverine1.png",
	"images/joker_aceo.png",
	"images/ditto_aceo.png",
	"images/Jolteon2.png",
	"images/snorlax.png",
	"images/nine_tails.png",
	"images/EspeonEx.png",
	"images/Meganium.png",
	"images/lilSlash_aceo.png",
	"images/Superman.png",
	"images/superman2.png",
	"images/MikeMikeIslandBoy.png",
	"images/Flareon2.png",
	"images/Charmander.png",
	"images/Charizard1.png",
	"images/Charizard2.png",
	"images/morty_aceo.png",
	"images/Orko.png",
	"images/mondo_aceo.png",
	"images/snoopy_aceo.png",
	"images/Miku.png",
	"images/FreddyKrieger.png",
	"images/FreddyK2.png",
	"images/JackSkellington4b.png",
	"images/Jack Nightmare Before Christmas.png",
	"images/Jack Pumpkin King BW.png",
	"images/Jack Pumpkin King.png",
	"images/batman.png",	
	"images/tmnt.png",
	"images/Samson2.png",
	"images/Samson1.png",
	"images/TheThingV1b.png",
	"images/TheFly.png",
	"images/MrMimeGoosebumps.png",
	"images/Beetlejuice NFT.png",
	"images/stream_minis1.png",
    "images/stream_minis2.png",
    "images/stream_lightboxes1.png",
    "images/stream_lightboxes2.png",
    "images/POKE3.png",
    "images/POKE4.png",
    "images/POKE5.png",
    "images/POKE6.png",
    "images/POKE7.png",
    "images/POKE8.png",
    "images/POKE1.png",
    "images/POKE2.png",
    "images/NARU.png",
    "images/SAIL1.png",
    "images/SAIL2.png",
    "images/GUNDAM.png",
    "images/GUNDAM2.png",
    "images/BEBOP.png",
    "images/BEBOP2.png",
    "images/one piece.png",
    "images/ONEPIE2.png",
    "images/DBZ1.png",
    "images/scroogeB.png",
    "images/HARVDENT.png",
    "images/CyberCatMiror.png",
    "images/POKE30pikachuNishiNite.png",
    "images/UmbreonNite.png",
    "images/UmbreonDay.png",
    // ⬆ add new products above this line ⬆
  ];

  /* ============================================================
     RENDER GALLERY
  ============================================================ */
  const galleryEl = document.getElementById('gallery');
  const countLabel = document.getElementById('countLabel');
  const total = PRODUCTS.length;
  const padWidth = Math.max(3, String(total).length);

  countLabel.textContent = String(total).padStart(padWidth, '0');

  function tagText(i){
    return String(i + 1).padStart(padWidth, '0') + ' / ' + String(total).padStart(padWidth, '0');
  }

  // "images/Cyberpunk Assassin.png" -> "cyberpunk assassin"
  // used only for search matching, never shown on the card itself
  function labelFromPath(path){
    const filename = path.split('/').pop().replace(/\.[a-zA-Z0-9]+$/, '');
    return filename.replace(/[_-]+/g, ' ').trim().toLowerCase();
  }

  PRODUCTS.forEach((src, i) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.searchLabel = labelFromPath(src);

    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', 'Open product ' + (i + 1) + ' of ' + total);

    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Product ' + (i + 1);
    img.loading = 'lazy';
    img.onerror = () => {
      img.remove();
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.innerHTML = 'NO IMAGE<br>' + src;
      card.prepend(ph);
    };

    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = tagText(i);

    card.append(img);
    slot.append(card, tag);
    galleryEl.appendChild(slot);

    // grid preview cards are intentionally plain — no tilt/shine here,
    // that only happens once a card is opened in the modal (see below)
    card.addEventListener('click', () => openModal(i));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(i); }
    });
  });

  /* ============================================================
     SEARCH / FILTER
     Matches against the filename-derived label stored on each
     slot (see labelFromPath above). Purely a show/hide filter —
     doesn't touch the modal's index or the array itself.
  ============================================================ */
  const searchInput = document.getElementById('searchInput');
  const searchCount  = document.getElementById('searchCount');
  const allSlots = Array.from(galleryEl.children);

  searchInput.addEventListener('input', () => {
    const query = searchInput.value.trim().toLowerCase();

    if (!query){
      allSlots.forEach(s => s.classList.remove('search-hidden'));
      searchCount.textContent = '';
      return;
    }

    let matches = 0;
    allSlots.forEach(s => {
      const isMatch = s.dataset.searchLabel.includes(query);
      s.classList.toggle('search-hidden', !isMatch);
      if (isMatch) matches++;
    });
    searchCount.textContent = matches + ' / ' + total + ' MATCH' + (matches === 1 ? '' : 'ES');
  });

  /* ============================================================
     HOLO POINTER EFFECT
     Pure pointer-driven — no ambient animation loop. Card sits
     dead still until the pointer moves over it, then eases back
     to flat on pointerleave. Bounding rect is measured fresh on
     every move, so this stays correct across window resizes.
  ============================================================ */
  function initHoloCard(cardEl){
    function handleMove(e){
      const rect = cardEl.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;

      const clientX = e.clientX ?? (e.touches && e.touches[0] && e.touches[0].clientX);
      const clientY = e.clientY ?? (e.touches && e.touches[0] && e.touches[0].clientY);
      if (clientX == null || clientY == null) return;

      let x = (clientX - rect.left) / rect.width;
      let y = (clientY - rect.top) / rect.height;
      x = Math.min(Math.max(x, 0), 1);
      y = Math.min(Math.max(y, 0), 1);

      const cx = x - 0.5;
      const cy = y - 0.5;
      const hyp = Math.min(Math.sqrt(cx * cx + cy * cy) / 0.5, 1);

      const rx = (cy * -12).toFixed(2) + 'deg';
      const ry = (cx * 12).toFixed(2) + 'deg';

      cardEl.classList.remove('is-resting');
      cardEl.style.setProperty('--mx', (x * 100).toFixed(2) + '%');
      cardEl.style.setProperty('--my', (y * 100).toFixed(2) + '%');
      cardEl.style.setProperty('--posx', (x * 100).toFixed(2) + '%');
      cardEl.style.setProperty('--posy', (y * 100).toFixed(2) + '%');
      cardEl.style.setProperty('--hyp', hyp.toFixed(3));
      cardEl.style.setProperty('--rx', rx);
      cardEl.style.setProperty('--ry', ry);
    }

    function handleLeave(){
      cardEl.classList.add('is-resting');
      cardEl.style.setProperty('--rx', '0deg');
      cardEl.style.setProperty('--ry', '0deg');
      cardEl.style.setProperty('--hyp', '0');
      cardEl.style.setProperty('--posx', '50%');
      cardEl.style.setProperty('--posy', '50%');
      cardEl.style.setProperty('--mx', '50%');
      cardEl.style.setProperty('--my', '50%');
    }

    cardEl.addEventListener('pointermove', handleMove);
    cardEl.addEventListener('pointerleave', handleLeave);
    cardEl.addEventListener('pointercancel', handleLeave);
    // keyboard users still get a resting card — no pointer position to fake
    cardEl.addEventListener('blur', handleLeave);
  }

  /* ============================================================
     MODAL / CLOSEUP VIEWER
  ============================================================ */
  const modal      = document.getElementById('modal');
  const modalStage  = document.getElementById('modalStage');
  const modalImg    = document.getElementById('modalImg');
  const modalCard   = document.getElementById('modalCard');
  const modalTag    = document.getElementById('modalTag');
  const closeBtn    = document.getElementById('closeBtn');
  const prevBtn     = document.getElementById('prevBtn');
  const nextBtn     = document.getElementById('nextBtn');

  let currentIndex = 0;
  let lastFocused = null;

  /* MAIN = tilt + glare only. HOLO = tilt + glare + rainbow shine.
     Toggling either updates the modal card immediately, even mid-view. */
  let mode = 'main';
  const modeButtons = document.querySelectorAll('.mode-btn');
  function setMode(next){
    mode = next;
    modeButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    modalCard.classList.toggle('holo', mode === 'holo');
  }
  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  function openModal(i){
    currentIndex = ((i % total) + total) % total;
    modalImg.src = PRODUCTS[currentIndex];
    modalImg.alt = 'Product ' + (currentIndex + 1);
    modalTag.innerHTML = 'ITEM <b>' + tagText(currentIndex) + '</b>';
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    lastFocused = document.activeElement;
    modalCard.classList.add('is-resting');
    modalCard.classList.toggle('holo', mode === 'holo');
    resetZoom();
    closeBtn.focus();

    // auto-scroll would fight the modal's own scroll lock — pause it,
    // and remember whether to turn it back on when the modal closes
    wasActiveBeforeModal = autoScrollActive;
    if (autoScrollActive) stopAutoScroll();
  }

  function closeModal(){
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (lastFocused) lastFocused.focus();
    resetZoom();

    if (wasActiveBeforeModal) startAutoScroll();
  }

  /* ============================================================
     CLOSEUP ZOOM + PAN
     Scroll wheel zooms in/out. While zoomed, hold the middle mouse
     button (scroll-wheel click) to grab and drag the image around.
     Panning is clamped so you can never drag the image edge inside
     the frame — and because the clamp bounds are derived directly
     from the zoom level, panning automatically shrinks back to
     dead-center as you zoom out, landing exactly at 0,0 by the
     time you're back to 1x. No special-case "snap back" needed.
  ============================================================ */
  const ZOOM_MIN  = 1;
  const ZOOM_MAX  = 3.5;
  const ZOOM_STEP = 0.12; // how much each wheel notch zooms — raise for snappier zoom

  let zoomLevel = 1;
  let panX = 0;
  let panY = 0;
  let isPanning = false;
  let panStart = { x: 0, y: 0, panX: 0, panY: 0 };

  // how far the image can be dragged before its edge would show —
  // exactly half the "extra" size the zoom has added, per axis
  function getPanBounds(){
    const rect = modalStage.getBoundingClientRect();
    return {
      maxX: (rect.width  * (zoomLevel - 1)) / 2,
      maxY: (rect.height * (zoomLevel - 1)) / 2
    };
  }

  function clampPan(){
    const { maxX, maxY } = getPanBounds();
    panX = Math.min(maxX, Math.max(-maxX, panX));
    panY = Math.min(maxY, Math.max(-maxY, panY));
  }

  function applyZoom(){
    clampPan(); // re-clamping here is what pulls pan back to 0 as zoom shrinks
    modalImg.style.setProperty('--zoom', zoomLevel.toFixed(2));
    modalImg.style.setProperty('--panX', panX.toFixed(1) + 'px');
    modalImg.style.setProperty('--panY', panY.toFixed(1) + 'px');
    modalImg.classList.toggle('zoomed', zoomLevel > 1);
  }

  function resetZoom(){
    zoomLevel = 1;
    panX = 0;
    panY = 0;
    applyZoom();
  }

  modalStage.addEventListener('wheel', (e) => {
    if (!modal.classList.contains('open')) return;
    e.preventDefault(); // stop the page from scrolling behind the modal
    const delta = e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP;
    zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomLevel + delta));
    applyZoom();
  }, { passive: false });

  // middle mouse button (button === 1) grabs and drags the image
  modalCard.addEventListener('mousedown', (e) => {
    if (e.button !== 1) return;
    e.preventDefault(); // stop the browser's native middle-click autoscroll
    isPanning = true;
    panStart = { x: e.clientX, y: e.clientY, panX, panY };
    modalImg.classList.add('dragging');
  });

  window.addEventListener('mousemove', (e) => {
    if (!isPanning) return;
    panX = panStart.panX + (e.clientX - panStart.x);
    panY = panStart.panY + (e.clientY - panStart.y);
    clampPan();
    modalImg.style.setProperty('--panX', panX.toFixed(1) + 'px');
    modalImg.style.setProperty('--panY', panY.toFixed(1) + 'px');
  });

  function endPan(){
    if (!isPanning) return;
    isPanning = false;
    modalImg.classList.remove('dragging');
  }
  window.addEventListener('mouseup', endPan);
  window.addEventListener('blur', endPan);

  function step(delta){
    openModal(currentIndex + delta);
  }

  closeBtn.addEventListener('click', closeModal);
  prevBtn.addEventListener('click', () => step(-1));
  nextBtn.addEventListener('click', () => step(1));

  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal(); // click on backdrop only
  });

  document.addEventListener('keydown', (e) => {
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  initHoloCard(modalCard);

  /* ============================================================
     RESIZE SAFETY
     Grid + modal sizing is done entirely in CSS with relative
     units (aspect-ratio, vh/vw, auto-fill/minmax), so layout
     reflows natively on any window/OBS-source resize with no
     JS needed. This listener only resets an in-progress holo
     tilt so a mid-drag resize can't leave a card stuck skewed.
  ============================================================ */
  /* ============================================================
     AUTO-SCROLL
     Toggle button (top-right) slowly scrolls the whole page down,
     bounces back up at the bottom, and repeats — for hands-off
     "walk away" stream moments. Runs via requestAnimationFrame,
     timed off the actual elapsed time between frames, so the
     speed stays consistent no matter the screen's refresh rate.

     ⚙ TO CHANGE SPEED: edit AUTO_SCROLL_SPEED below.
        It's in pixels-per-second. Bigger number = faster scroll.
        Try 15–25 for very slow/ambient, 40–60 for a brisker pace.
  ============================================================ */
  const AUTO_SCROLL_SPEED = 45; // px/second — ← edit this to change scroll speed

  const autoScrollBtn   = document.getElementById('autoScrollBtn');
  const autoScrollLabel = document.getElementById('autoScrollLabel');

  let autoScrollActive   = false;
  let autoScrollDir      = 1;   // 1 = scrolling down, -1 = scrolling up
  let autoScrollRafId    = null;
  let autoScrollLastTime = null;
  let wasActiveBeforeModal = false;

  function maxScrollY(){
    return Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  }

  function autoScrollStep(timestamp){
    if (!autoScrollActive) return;

    if (autoScrollLastTime === null) autoScrollLastTime = timestamp;
    const deltaSeconds = (timestamp - autoScrollLastTime) / 1000;
    autoScrollLastTime = timestamp;

    const max = maxScrollY();
    let next = window.scrollY + autoScrollDir * AUTO_SCROLL_SPEED * deltaSeconds;

    if (next >= max){
      next = max;
      autoScrollDir = -1;       // hit the bottom row — reverse upward
    } else if (next <= 0){
      next = 0;
      autoScrollDir = 1;        // hit the top — reverse downward
    }

    window.scrollTo(0, next);
    autoScrollRafId = requestAnimationFrame(autoScrollStep);
  }

  function startAutoScroll(){
    if (autoScrollActive) return;
    autoScrollActive = true;
    autoScrollLastTime = null;
    autoScrollBtn.classList.add('active');
    autoScrollBtn.setAttribute('aria-pressed', 'true');
    autoScrollLabel.textContent = 'AUTO';
    autoScrollRafId = requestAnimationFrame(autoScrollStep);
  }

  function stopAutoScroll(){
    autoScrollActive = false;
    autoScrollBtn.classList.remove('active');
    autoScrollBtn.setAttribute('aria-pressed', 'false');
    if (autoScrollRafId) cancelAnimationFrame(autoScrollRafId);
  }

  autoScrollBtn.addEventListener('click', () => {
    if (autoScrollActive) stopAutoScroll();
    else startAutoScroll();
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      modalCard.classList.add('is-resting');
      modalCard.style.setProperty('--rx', '0deg');
      modalCard.style.setProperty('--ry', '0deg');
      modalCard.style.setProperty('--hyp', '0');
    }, 120);
  });
</script>
</body>
</html>
